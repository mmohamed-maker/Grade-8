name: Grade 8 Course Games Arabic Audio
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/course_games_voice_data.json'
      - 'scripts/generate_course_games_audio.py'
      - '.github/workflows/generate-course-games-audio.yml'
permissions:
  contents: write
concurrency:
  group: grade8-course-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'edge-tts>=7,<9'
      - name: Generate Arabic voice recordings
        run: python scripts/generate_course_games_audio.py
      - name: Commit recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/course-games
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate neural Arabic narration for course listening games"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
