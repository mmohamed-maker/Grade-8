name: Generate grade 6 bottle listening audio
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_grade6_bottle_audio.py'
      - '.github/workflows/generate-grade6-bottle-audio.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech client
        run: python -m pip install --disable-pip-version-check 'edge-tts>=7,<9'
      - name: Generate mastered Arabic MP3
        run: python scripts/generate_grade6_bottle_audio.py
      - name: Preserve MP3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: grade6-bottle-listening-mp3
          path: assets/audio/grade6-bottle-listening.mp3
          if-no-files-found: error
      - name: Save generated MP3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/grade6-bottle-listening.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Generate mastered grade 6 listening MP3"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
