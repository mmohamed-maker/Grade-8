name: Generate Arabic Neural Audio

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_arabic_audio.py'
      - '.github/workflows/generate-arabic-audio.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install text-to-speech client
        run: python -m pip install --disable-pip-version-check 'edge-tts>=7,<9'
      - name: Generate fully vowelled Arabic audio clips
        run: python scripts/generate_arabic_audio.py
      - name: Commit generated MP3 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Generate Arabic neural speech MP3 for listening activities"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Failed to publish audio after retries" >&2
            exit 1
          fi
